<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de OS - Modo Paisagem</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* ===================== Temas (variáveis) ===================== */
        :root {
            --bg-page: #eef2f7;
            --bg-card: #ffffff;
            --bg-card-alt: #f8fafc;
            --bg-panel: #f0f3f7;
            --bg-panel-alt: #e9edf2;
            --bg-row-even: #f8fafc;
            --bg-row-hover: #e6f0ff;
            --border-color: #dde0e6;
            --border-soft: #e0e4ea;
            --text-main: #1a2a3a;
            --text-secondary: #555555;
            --text-muted: #888888;
            --accent: #2a7de1;
            --accent-hover: #1a5fb0;
            --accent-soft: #cce5ff;
            --schedule-highlight: rgba(229, 0, 18, 0.10);
            --schedule-highlight-alt: rgba(229, 0, 18, 0.16);            --danger: #dc3545;
            --danger-hover: #b02a37;
            --success: #28a745;
            --success-hover: #1e7e34;
            --neutral-btn: #e0e4ea;
            --neutral-btn-hover: #c8cdd6;
            --outline-btn: #6c757d;
            --outline-btn-hover: #5a6268;
            --shadow-soft: rgba(0,0,0,0.08);
            --shadow-softer: rgba(0,0,0,0.05);
            --input-bg: #ffffff;
            --input-border: #cccccc;
            --scrollbar-track: #f0f3f7;
            --scrollbar-thumb: #c3cbd6;
        }

        [data-theme="dark"] {
            --bg-page: #12161d;
            --bg-card: #1a1f28;
            --bg-card-alt: #1f2530;
            --bg-panel: #1c222c;
            --bg-panel-alt: #1c222c;
            --bg-row-even: #1e2430;
            --bg-row-hover: #2a2033;
            --border-color: #2c3341;
            --border-soft: #262c38;
            --text-main: #eef2f7;
            --text-secondary: #b6bfcc;
            --text-muted: #8a93a3;
            --accent: #e50012;
            --accent-hover: #ff2233;
            --accent-soft: #401017;
            --schedule-highlight: rgba(229, 0, 18, 0.22);
            --schedule-highlight-alt: rgba(229, 0, 18, 0.30);
            --danger: #e50012;
            --danger-hover: #ff2233;
            --success: #2fbf6a;
            --success-hover: #26a45a;
            --neutral-btn: #262c38;
            --neutral-btn-hover: #323a4a;
            --outline-btn: #3a4152;
            --outline-btn-hover: #4a5266;
            --shadow-soft: rgba(0,0,0,0.35);
            --shadow-softer: rgba(0,0,0,0.25);
            --input-bg: #1c222c;
            --input-border: #333b4a;
            --scrollbar-track: #1a1f28;
            --scrollbar-thumb: #3a4152;
        }

        /* Reset e layout base */
        * { box-sizing: border-box; font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif; }
        html { color-scheme: light; }
        html[data-theme="dark"] { color-scheme: dark; }
        body {
            background: var(--bg-page);
            margin: 0;
            padding: 10px 15px;
            min-height: 100vh;
            transition: background 0.25s ease, color 0.25s ease;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 20px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow-soft);
            width: 100%;
            transition: background 0.25s ease;
        }

        /* Cabeçalho com alternador de tema */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        h1 {
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.6rem;
            margin: 0;
        }
        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            transition: 0.2s;
            flex-shrink: 0;
        }
        .theme-toggle:hover {
            background: var(--bg-panel-alt);
            border-color: var(--accent);
        }
        .theme-toggle .icon { font-size: 1rem; line-height: 1; }

        .upload-area {
            border: 2px dashed var(--border-color);
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            background: var(--bg-card-alt);
            margin-bottom: 25px;
        }
        .upload-area input[type="file"] { font-size: 16px; color: var(--text-main); }
        .upload-area label { color: var(--text-main); }

        /* Filtros em grid - mais colunas em telas largas */
        .filters-panel {
            background: var(--bg-panel);
            padding: 20px 22px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            align-items: start;
        }
        .filter-group {
            background: var(--bg-card);
            padding: 18px 20px;
            border-radius: 8px;
            box-shadow: 0 1px 3px var(--shadow-softer);
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .filter-group label {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-main);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 6px;
            flex-wrap: wrap;
        }
        .filter-group .options {
            max-height: 220px;
            overflow-y: auto;
            overflow-x: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 10px;
            margin-right: -4px;
            flex: 1;
        }
        .filter-group .options label {
            font-weight: normal;
            font-size: 0.95rem;
            line-height: 1.45;
            display: grid;
            grid-template-columns: 20px max-content;
            align-items: start;
            column-gap: 12px;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 6px;
            color: var(--text-secondary);
            white-space: nowrap;
            transition: background 0.15s;
        }
        .filter-group .options label:hover {
            background: var(--bg-row-hover);
        }
        .filter-group .options input[type="checkbox"] {
            margin: 3px 0 0 0;
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .filter-group .filter-actions {
            display: flex;
            gap: 5px;
            margin-top: 6px;
            border-top: 1px solid var(--border-soft);
            padding-top: 6px;
        }
        .filter-group .filter-actions button {
            background: var(--neutral-btn);
            border: none;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.15s;
            color: var(--text-main);
        }
        .filter-group .filter-actions button:hover { background: var(--neutral-btn-hover); }
        .filter-group .date-range {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-group .date-range span {
            font-size: 0.8rem;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .filter-group .date-range input[type="date"] {
            padding: 6px 8px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            font-size: 0.85rem;
            flex: 1 1 130px;
            min-width: 130px;
            background: var(--input-bg);
            color: var(--text-main);
            color-scheme: light;
        }
        [data-theme="dark"] .filter-group .date-range input[type="date"] {
            color-scheme: dark;
        }
        .filter-group .clear-date-btn {
            background: var(--outline-btn);
            color: white;
            border: none;
            padding: 2px 12px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            margin-top: 4px;
            align-self: flex-start;
        }
        .filter-group .clear-date-btn:hover { background: var(--outline-btn-hover); }

        .filters-panel .date-range-group {
            grid-column: 1 / -1;
            order: -1;
        }
        .date-range-group .date-range {
            max-width: 420px;
        }

        /* Barra de pesquisa - horizontal */
        .search-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-card);
            padding: 8px 20px;
            border-radius: 30px;
            box-shadow: 0 1px 4px var(--shadow-softer);
            margin-bottom: 18px;
            flex-wrap: nowrap;
            width: 100%;
            border: 1px solid var(--border-soft);
        }
        .search-bar input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid var(--input-border);
            border-radius: 30px;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
            min-width: 200px;
            background: var(--input-bg);
            color: var(--text-main);
        }
        .search-bar input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .search-bar .search-icon { font-size: 1.3rem; flex-shrink: 0; }
        .search-bar .clear-search {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 8px;
            flex-shrink: 0;
        }
        .search-bar .clear-search:hover { color: var(--text-main); }
        .search-bar .search-count {
            font-size: 0.9rem;
            color: var(--text-secondary);
            white-space: nowrap;
            font-weight: 500;
            flex-shrink: 0;
        }

        /* Estatísticas */
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 12px 0 18px 0;
            background: var(--bg-panel-alt);
            padding: 10px 18px;
            border-radius: 8px;
            align-items: center;
        }
        .stats-item {
            background: var(--bg-card);
            padding: 4px 16px;
            border-radius: 30px;
            box-shadow: 0 1px 4px var(--shadow-softer);
            font-size: 0.9rem;
            color: var(--text-main);
            white-space: nowrap;
        }
        .clear-all { margin-left: auto; }

        /* Resumos - mais espaçados */
        .summary-section {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 18px 0;
            align-items: stretch;
        }
        .summary-card {
            background: var(--bg-card-alt);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px 18px;
            flex: 1 1 240px;
            min-width: 230px;
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .summary-card h3 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }
        .summary-card table {
            width: 100%;
            font-size: 0.9rem;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .summary-card td {
            padding: 7px 6px;
            border-bottom: 1px solid var(--border-soft);
            cursor: default;
            color: var(--text-secondary);
            line-height: 1.35;
            word-break: break-word;
        }
        .summary-card td:first-child {
            width: auto;
        }
        .summary-card td:last-child {
            text-align: right;
            font-weight: bold;
            color: var(--text-main);
            width: 44px;
            min-width: 44px;
            white-space: nowrap;
            padding-left: 10px;
        }
        .summary-card tr.clickable td {
            cursor: pointer;
        }
        .summary-card tr.clickable:hover td {
            background: var(--bg-row-hover);
        }
        .summary-card tr.active td {
            background: var(--accent-soft);
            font-weight: bold;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 6px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: var(--danger-hover); }
        .btn-download { background: var(--success); }
        .btn-download:hover { background: var(--success-hover); }
        .btn-outline { background: var(--outline-btn); }
        .btn-outline:hover { background: var(--outline-btn-hover); }

        /* TABELA - ocupando toda a largura, com texto visível */
        .table-wrap {
            overflow-x: auto;
            margin-top: 15px;
            max-height: 550px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            table-layout: auto; /* permite que as colunas se ajustem ao conteúdo */
        }
        th {
            background: var(--accent);
            color: white;
            position: sticky;
            top: 0;
            z-index: 2;
            padding: 10px 10px;
            text-align: left;
            white-space: nowrap;
            font-weight: 600;
        }
        td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border-soft);
            white-space: normal;      /* quebra de linha */
            word-break: break-word;   /* quebra palavras longas */
            max-width: 350px;         /* evita que uma coluna tome conta */
            vertical-align: top;
            color: var(--text-main);
        }
        tr:nth-child(even) { background: var(--bg-row-even); }
        tr.has-schedule { background: var(--schedule-highlight); }
        tr.has-schedule:nth-child(even) { background: var(--schedule-highlight-alt); }
        .info { color: var(--text-secondary); padding: 10px 0; }

        /* Scrollbars finas, alinhadas ao tema */
        .table-wrap::-webkit-scrollbar,
        .filter-group .options::-webkit-scrollbar,
        .summary-card::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .table-wrap::-webkit-scrollbar-track,
        .filter-group .options::-webkit-scrollbar-track,
        .summary-card::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        .table-wrap::-webkit-scrollbar-thumb,
        .filter-group .options::-webkit-scrollbar-thumb,
        .summary-card::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
        }

        /* Responsivo para telas menores */
        @media (max-width: 1024px) {
            .filters-panel { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
        }
        @media (max-width: 768px) {
            .filters-panel { grid-template-columns: 1fr; }
            .stats-bar { flex-direction: column; align-items: stretch; }
            .clear-all { margin-left: 0; }
            .search-bar { flex-wrap: wrap; }
            .search-bar input { min-width: 120px; }
            .container { padding: 12px; }
            td { max-width: 200px; }
            .page-header { flex-direction: column; align-items: flex-start; }
            .theme-toggle { align-self: flex-end; }
        }
        @media (min-width: 1400px) {
            td { max-width: 450px; }
        }
        @media (min-width: 1700px) {
            .filters-panel { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="page-header">
        <h1>📊 Analisador de Ordens de Serviço</h1>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Alternar tema claro/escuro">
            <span class="icon" id="themeIcon">🌙</span>
            <span id="themeLabel">Modo escuro</span>
        </button>
    </div>

    <div class="upload-area">
        <label for="fileUpload" style="font-weight:600; display:block; margin-bottom:10px;">📁 Carregue seu arquivo (CSV ou XLSX)</label>
        <input type="file" id="fileUpload" accept=".csv,.xlsx,.xls">
        <div id="fileInfo" class="info" style="margin-top:10px;"></div>
    </div>

    <!-- Filtros -->
    <div id="filtersPanel" class="filters-panel" style="display:none;"></div>

    <!-- Barra de pesquisa -->
    <div id="searchBar" class="search-bar" style="display:none;">
        <span class="search-icon">🔍</span>
        <input type="text" id="clienteSearch" placeholder="Pesquisar cliente..." />
        <button class="clear-search" id="clearSearchBtn" title="Limpar pesquisa">✕</button>
        <span class="search-count" id="searchCount">0 clientes encontrados</span>
    </div>

    <!-- Estatísticas -->
    <div id="statsBar" class="stats-bar" style="display:none;">
        <span id="countDisplay" class="stats-item">📌 Total: 0</span>
        <span id="statusDisplay" class="stats-item">🏷️ Status mais comum: -</span>
        <span id="quickFilterDisplay" class="stats-item" style="display:none; background:#ffc107; color:#1a2a3a;">🔍 Filtro rápido ativo</span>
        <button class="btn btn-danger clear-all" id="clearFiltersBtn">🧹 Limpar todos os filtros</button>
        <button class="btn btn-outline" id="clearQuickFiltersBtn" style="display:none;">✖️ Limpar filtro rápido</button>
    </div>

    <!-- Resumos -->
    <div id="summarySection" class="summary-section" style="display:none;"></div>

    <!-- Download -->
    <div id="downloadArea" style="display:none; margin: 10px 0;">
        <button class="btn btn-download" id="downloadBtn">⬇️ Baixar filtrado (CSV)</button>
    </div>

    <!-- Tabela -->
    <div id="tableWrapper" class="table-wrap" style="display:none;">
        <table id="resultTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // ---------- Tema (dia/noite) ----------
    (function initTheme() {
        const root = document.documentElement;
        const toggleBtn = document.getElementById('themeToggle');
        const icon = document.getElementById('themeIcon');
        const label = document.getElementById('themeLabel');

        function applyTheme(theme) {
            root.setAttribute('data-theme', theme);
            if (theme === 'dark') {
                icon.textContent = '☀️';
                label.textContent = 'Modo claro';
            } else {
                icon.textContent = '🌙';
                label.textContent = 'Modo escuro';
            }
        }

        const saved = localStorage.getItem('analisadorOsTheme');
        let initial;
        if (saved === 'dark' || saved === 'light') {
            initial = saved;
        } else {
            initial = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        applyTheme(initial);

        toggleBtn.addEventListener('click', function() {
            const current = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
            localStorage.setItem('analisadorOsTheme', next);
        });

        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                if (!localStorage.getItem('analisadorOsTheme')) {
                    applyTheme(e.matches ? 'dark' : 'light');
                }
            });
        }
    })();

    // ---------- Variáveis ----------
    let originalData = [];
    let filteredData = [];
    let allColumns = [];
    let currentFilters = {};
    let dateReservadaFilter = { start: null, end: null };
    let activeQuickFilter = null;
    let searchTerm = '';

    const filterColumns = ['Filial', 'Status', 'Cliente', 'Assunto', 'Cidade', 'Prioridade', 'Gerada por', 'Colaborador', 'Status conexão', 'Melhor horário'];
    const displayColumns = ['ID', 'Filial', 'Abertura', 'Status', 'Cliente', 'Assunto', 'Cidade', 'Prioridade', 'Gerada por', 'Colaborador', 'Final', 'Data reservada', 'Status conexão', 'Melhor horário'];

    const defaultAssuntos = [
        'REPARO - CLIENTE ATENUADO',
        'REPARO - MUDANÇA DE PONTO INTERNO',
        'REPARO - REPARO APLICATIVOS',
        'REPARO - REPARO DE OSCILAÇÃO',
        'REPARO - REPETIDOR DE SINAL',
        'REPARO - TROCA DE EQUIPAMENTO',
        'REPARO- SEM CONEXÃO',
        'TECNICO - AJUSTE FIAÇÃO INT/EXT',
        'INSTALAÇÃO - INSTALAÇÃO EQUIPAMENTO FIRESTICK'
    ];

    const defaultStatuses = ['Aberta', 'Agendada'];

    // ---------- Utilitários ----------
    function cleanValue(val) {
        if (typeof val === 'string') {
            val = val.trim();
            if (val.startsWith('"')) val = val.substring(1);
            if (val.endsWith('"')) val = val.slice(0, -1);
            if (val.startsWith('=')) val = val.substring(1);
            if (val.startsWith('"')) val = val.substring(1);
            if (val.endsWith('"')) val = val.slice(0, -1);
        }
        return val;
    }

    function parseDateOnly(str) {
        if (!str || typeof str !== 'string') return null;
        let parts = str.trim().split(' ');
        let datePart = parts[0];
        let d = datePart.split('/');
        if (d.length !== 3) return null;
        let day = parseInt(d[0]), month = parseInt(d[1])-1, year = parseInt(d[2]);
        if (isNaN(day) || isNaN(month) || isNaN(year)) return null;
        return new Date(year, month, day);
    }

    function formatDate(d) {
        if (!d) return '';
        let day = String(d.getDate()).padStart(2,'0');
        let month = String(d.getMonth()+1).padStart(2,'0');
        let year = d.getFullYear();
        return `${day}/${month}/${year}`;
    }

    // ---------- Leitura do arquivo ----------
    function handleFile(file) {
        const ext = file.name.split('.').pop().toLowerCase();
        if (ext === 'csv') {
            const reader = new FileReader();
            reader.onload = function(e) {
                const csv = e.target.result;
                Papa.parse(csv, {
                    delimiter: ';',
                    quoteChar: '"',
                    header: true,
                    skipEmptyLines: true,
                    transform: function(value) { return cleanValue(value); },
                    complete: function(results) {
                        if (results.errors.length) {
                            alert('Erro ao ler CSV: ' + results.errors[0].message);
                            return;
                        }
                        processData(results.data);
                    }
                });
            };
            reader.readAsText(file, 'UTF-8');
        } else if (ext === 'xlsx' || ext === 'xls') {
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
                const cleaned = json.map(row => {
                    let newRow = {};
                    for (let key in row) {
                        newRow[key] = cleanValue(row[key]);
                    }
                    return newRow;
                });
                processData(cleaned);
            };
            reader.readAsArrayBuffer(file);
        } else {
            alert('Formato não suportado. Use .csv, .xlsx ou .xls');
        }
    }

    // ---------- Processamento ----------
    function processData(dataArray) {
        if (!dataArray || dataArray.length === 0) {
            alert('Nenhum dado encontrado.');
            return;
        }
        originalData = dataArray;
        allColumns = Object.keys(originalData[0]);

        originalData.forEach(row => {
            let rawAbertura = row['Abertura'] || '';
            let dtAbertura = parseDateOnly(rawAbertura);
            row['_dataAbertura'] = dtAbertura ? formatDate(dtAbertura) : '';

            let rawReservada = row['Data reservada'] || '';
            let dtReservada = parseDateOnly(rawReservada);
            row['_dataReservada'] = dtReservada ? formatDate(dtReservada) : '';
            row['_dataReservadaObj'] = dtReservada;
            row['_temAgendamento'] = (rawReservada.trim() !== '');
        });

        currentFilters = {};
        filterColumns.forEach(col => {
            if (allColumns.includes(col)) {
                currentFilters[col] = null;
            }
        });

        buildFiltersPanel();
        setupSearch();
        applyFilters();

        document.getElementById('fileInfo').innerHTML = `✅ ${originalData.length} registros carregados.`;
        document.getElementById('filtersPanel').style.display = 'grid';
        document.getElementById('searchBar').style.display = 'flex';
        document.getElementById('statsBar').style.display = 'flex';
        document.getElementById('summarySection').style.display = 'flex';
        document.getElementById('downloadArea').style.display = 'block';
        document.getElementById('tableWrapper').style.display = 'block';
    }

    // ---------- Barra de pesquisa ----------
    function setupSearch() {
        const input = document.getElementById('clienteSearch');
        const clearBtn = document.getElementById('clearSearchBtn');

        input.addEventListener('input', function() {
            searchTerm = this.value.trim().toLowerCase();
            applyFilters();
        });

        clearBtn.addEventListener('click', function() {
            input.value = '';
            searchTerm = '';
            applyFilters();
            input.focus();
        });
    }

    // ---------- Construir filtros ----------
    function buildFiltersPanel() {
        const panel = document.getElementById('filtersPanel');
        panel.innerHTML = '';

        filterColumns.forEach(col => {
            if (!allColumns.includes(col)) return;
            const values = [...new Set(originalData.map(row => row[col] || ''))].filter(v => v !== '').sort();
            if (values.length === 0) return;

            const group = document.createElement('div');
            group.className = 'filter-group';

            const label = document.createElement('label');
            label.textContent = col === 'Melhor horário' ? 'Período' : col;
            const countSpan = document.createElement('span');
            countSpan.style.fontWeight = 'normal';
            countSpan.style.fontSize = '0.7rem';
            countSpan.style.color = 'var(--text-muted)';
            countSpan.id = 'count-' + col.replace(/\s/g, '');
            label.appendChild(countSpan);
            group.appendChild(label);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';

            values.forEach(v => {
                const lbl = document.createElement('label');
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = v;
                cb.dataset.col = col;

                if (col === 'Assunto') {
                    cb.checked = defaultAssuntos.includes(v);
                } else if (col === 'Status') {
                    cb.checked = defaultStatuses.includes(v);
                } else {
                    cb.checked = true;
                }

                cb.addEventListener('change', function() {
                    updateFilterFromCheckboxes(col);
                });
                lbl.appendChild(cb);
                lbl.appendChild(document.createTextNode(v));
                optionsDiv.appendChild(lbl);
            });

            group.appendChild(optionsDiv);

            const actions = document.createElement('div');
            actions.className = 'filter-actions';
            const btnAll = document.createElement('button');
            btnAll.textContent = 'Todos';
            btnAll.addEventListener('click', function() {
                const cbs = group.querySelectorAll('input[type="checkbox"]');
                cbs.forEach(cb => cb.checked = true);
                updateFilterFromCheckboxes(col);
            });
            const btnNone = document.createElement('button');
            btnNone.textContent = 'Nenhum';
            btnNone.addEventListener('click', function() {
                const cbs = group.querySelectorAll('input[type="checkbox"]');
                cbs.forEach(cb => cb.checked = false);
                updateFilterFromCheckboxes(col);
            });
            actions.appendChild(btnAll);
            actions.appendChild(btnNone);
            group.appendChild(actions);

            panel.appendChild(group);
        });

        // Filtro Data reservada
        if (allColumns.includes('Data reservada')) {
            const group = document.createElement('div');
            group.className = 'filter-group date-range-group';

            const label = document.createElement('label');
            label.textContent = 'Data reservada (intervalo)';
            group.appendChild(label);

            const rangeDiv = document.createElement('div');
            rangeDiv.className = 'date-range';
            rangeDiv.innerHTML = `
                <span>De</span>
                <input type="date" id="reservadaStart">
                <span>até</span>
                <input type="date" id="reservadaEnd">
            `;
            group.appendChild(rangeDiv);

            const clearBtn = document.createElement('button');
            clearBtn.textContent = 'Limpar datas';
            clearBtn.className = 'clear-date-btn';
            clearBtn.addEventListener('click', function() {
                document.getElementById('reservadaStart').value = '';
                document.getElementById('reservadaEnd').value = '';
                dateReservadaFilter.start = null;
                dateReservadaFilter.end = null;
                applyFilters();
            });
            group.appendChild(clearBtn);

            panel.appendChild(group);

            document.getElementById('reservadaStart').addEventListener('change', function() {
                dateReservadaFilter.start = this.value ? new Date(this.value + 'T00:00:00') : null;
                applyFilters();
            });
            document.getElementById('reservadaEnd').addEventListener('change', function() {
                dateReservadaFilter.end = this.value ? new Date(this.value + 'T23:59:59') : null;
                applyFilters();
            });
        }

        document.getElementById('clearFiltersBtn').addEventListener('click', clearAllFilters);
        document.getElementById('clearQuickFiltersBtn').addEventListener('click', clearQuickFilters);
        updateFilterCounts();
    }

    function updateFilterCounts() {
        document.querySelectorAll('.filter-group').forEach(group => {
            const cbs = group.querySelectorAll('input[type="checkbox"]');
            const checked = group.querySelectorAll('input[type="checkbox"]:checked');
            const countSpan = group.querySelector('label span');
            if (countSpan) {
                countSpan.textContent = `(${checked.length}/${cbs.length})`;
            }
        });
    }

    function updateFilterFromCheckboxes(col) {
        const group = document.querySelector(`.filter-group:has(input[data-col="${col}"])`);
        if (!group) return;
        const cbs = group.querySelectorAll('input[type="checkbox"]:checked');
        const selected = Array.from(cbs).map(cb => cb.value);
        currentFilters[col] = selected.length > 0 ? selected : null;
        updateFilterCounts();
        applyFilters();
    }

    function clearAllFilters() {
        const allCbs = document.querySelectorAll('#filtersPanel input[type="checkbox"]');
        allCbs.forEach(cb => {
            const col = cb.dataset.col;
            if (col === 'Assunto') {
                cb.checked = defaultAssuntos.includes(cb.value);
            } else if (col === 'Status') {
                cb.checked = defaultStatuses.includes(cb.value);
            } else {
                cb.checked = true;
            }
        });

        filterColumns.forEach(col => {
            if (allColumns.includes(col)) {
                const group = document.querySelector(`.filter-group:has(input[data-col="${col}"])`);
                if (group) {
                    const cbs = group.querySelectorAll('input[type="checkbox"]:checked');
                    const selected = Array.from(cbs).map(cb => cb.value);
                    currentFilters[col] = selected.length > 0 ? selected : null;
                }
            }
        });

        document.getElementById('reservadaStart').value = '';
        document.getElementById('reservadaEnd').value = '';
        dateReservadaFilter.start = null;
        dateReservadaFilter.end = null;

        document.getElementById('clienteSearch').value = '';
        searchTerm = '';

        clearQuickFilters();
        updateFilterCounts();
        applyFilters();
    }

    // ---------- Filtros rápidos ----------
    function toggleQuickFilter(col, value) {
        if (activeQuickFilter && activeQuickFilter.col === col && activeQuickFilter.value === value) {
            clearQuickFilters();
        } else {
            activeQuickFilter = { col: col, value: value };
            document.getElementById('quickFilterDisplay').style.display = 'inline-block';
            document.getElementById('clearQuickFiltersBtn').style.display = 'inline-block';
            document.getElementById('quickFilterDisplay').innerHTML = `🔍 Filtro rápido: ${col} = ${value}`;
            applyFilters();
        }
    }

    function clearQuickFilters() {
        activeQuickFilter = null;
        document.getElementById('quickFilterDisplay').style.display = 'none';
        document.getElementById('clearQuickFiltersBtn').style.display = 'none';
        document.querySelectorAll('.summary-card tr').forEach(tr => tr.classList.remove('active'));
        applyFilters();
    }

    // ---------- Aplicar filtros ----------
    function applyFilters() {
        let data = [...originalData];

        for (let col in currentFilters) {
            const selected = currentFilters[col];
            if (selected && Array.isArray(selected) && selected.length > 0) {
                data = data.filter(row => selected.includes(row[col] || ''));
            }
        }

        if (searchTerm) {
            data = data.filter(row => {
                const cliente = (row['Cliente'] || '').toLowerCase();
                return cliente.includes(searchTerm);
            });
        }

        if (dateReservadaFilter.start && dateReservadaFilter.end) {
            data = data.filter(row => {
                const d = row['_dataReservadaObj'];
                if (!d) return false;
                return d >= dateReservadaFilter.start && d <= dateReservadaFilter.end;
            });
        } else if (dateReservadaFilter.start) {
            data = data.filter(row => {
                const d = row['_dataReservadaObj'];
                return d && d >= dateReservadaFilter.start;
            });
        } else if (dateReservadaFilter.end) {
            data = data.filter(row => {
                const d = row['_dataReservadaObj'];
                return d && d <= dateReservadaFilter.end;
            });
        }

        if (activeQuickFilter) {
            const col = activeQuickFilter.col;
            const value = activeQuickFilter.value;
            data = data.filter(row => (row[col] || '') === value);
        }

        filteredData = data;

        // Prioriza clientes com Data reservada (agendamento) no topo da lista
        filteredData.sort((a, b) => {
            const aTem = a['_temAgendamento'] ? 1 : 0;
            const bTem = b['_temAgendamento'] ? 1 : 0;
            if (aTem !== bTem) return bTem - aTem;
            if (aTem && bTem && a['_dataReservadaObj'] && b['_dataReservadaObj']) {
                return a['_dataReservadaObj'] - b['_dataReservadaObj'];
            }
            return 0;
        });

        updateStatsAndCount();
        updateSearchCount();
        renderSummaries();
        renderTable();
        updateDownload();

        if (activeQuickFilter) {
            const col = activeQuickFilter.col;
            const value = activeQuickFilter.value;
            const cardTitles = {
                'Assunto': '📋 Assuntos',
                'Colaborador': '👤 Agendamentos por Colaborador',
                'Melhor horário': '🕒 Período'
            };
            const title = cardTitles[col];
            if (title) {
                document.querySelectorAll('.summary-card').forEach(card => {
                    const h3 = card.querySelector('h3');
                    if (h3 && h3.textContent === title) {
                        card.querySelectorAll('tr').forEach(tr => {
                            const td = tr.querySelector('td:first-child');
                            if (td && td.textContent === value) {
                                tr.classList.add('active');
                            } else {
                                tr.classList.remove('active');
                            }
                        });
                    }
                });
            }
        }
        updateFilterCounts();
    }

    function updateSearchCount() {
        document.getElementById('searchCount').textContent = `${filteredData.length} clientes encontrados`;
    }

    // ---------- Estatísticas ----------
    function updateStatsAndCount() {
        const total = filteredData.length;
        document.getElementById('countDisplay').textContent = `📌 Total: ${total}`;
        if (total === 0) {
            document.getElementById('statusDisplay').textContent = '🏷️ Status mais comum: -';
            return;
        }
        if (allColumns.includes('Status')) {
            const statusCount = {};
            filteredData.forEach(r => {
                let s = r['Status'] || 'Desconhecido';
                statusCount[s] = (statusCount[s]||0)+1;
            });
            let maxStatus = Object.keys(statusCount).reduce((a,b) => statusCount[a] > statusCount[b] ? a : b);
            document.getElementById('statusDisplay').textContent = `🏷️ Status mais comum: ${maxStatus} (${statusCount[maxStatus]})`;
        }
    }

    // ---------- Resumos ----------
    function renderSummaries() {
        const container = document.getElementById('summarySection');
        container.innerHTML = '';

        if (filteredData.length === 0) {
            container.innerHTML = '<div class="summary-card" style="flex:1; text-align:center; color:var(--text-muted);">Nenhum dado para resumir.</div>';
            return;
        }

        const byAssunto = {};
        filteredData.forEach(r => {
            let key = r['Assunto'] || 'Sem assunto';
            byAssunto[key] = (byAssunto[key]||0)+1;
        });
        const sortedAssunto = Object.entries(byAssunto).sort((a,b) => b[1]-a[1]);

        const byGeradaPor = {};
        filteredData.forEach(r => {
            let key = r['Gerada por'] || 'Não informado';
            byGeradaPor[key] = (byGeradaPor[key]||0)+1;
        });
        const sortedGeradaPor = Object.entries(byGeradaPor).sort((a,b) => b[1]-a[1]);

        const byDiaAbertura = {};
        filteredData.forEach(r => {
            let key = r['_dataAbertura'] || 'Sem data';
            byDiaAbertura[key] = (byDiaAbertura[key]||0)+1;
        });
        const sortedDiaAbertura = Object.entries(byDiaAbertura).sort((a,b) => a[0].localeCompare(b[0]));

        const byDataReservada = {};
        filteredData.forEach(r => {
            let key = r['_dataReservada'] || 'Sem reserva';
            byDataReservada[key] = (byDataReservada[key]||0)+1;
        });
        const sortedDataReservada = Object.entries(byDataReservada).sort((a,b) => a[0].localeCompare(b[0]));

        const byColaboradorAgend = {};
        filteredData.forEach(r => {
            if (r['_temAgendamento'] && r['Data reservada'] && r['Data reservada'].trim() !== '') {
                let key = r['Colaborador'] || 'Não informado';
                byColaboradorAgend[key] = (byColaboradorAgend[key]||0)+1;
            }
        });
        const sortedColaboradorAgend = Object.entries(byColaboradorAgend).sort((a,b) => b[1]-a[1]);

        const byPeriodo = {};
        filteredData.forEach(r => {
            let key = r['Melhor horário'] || 'Não informado';
            byPeriodo[key] = (byPeriodo[key]||0)+1;
        });
        const sortedPeriodo = Object.entries(byPeriodo).sort((a,b) => b[1]-a[1]);

        const cardAssunto = createClickableSummaryCard('📋 Assuntos', sortedAssunto, 'Assunto');
        const cardGerada = createClickableSummaryCard('👤 Quem abriu', sortedGeradaPor, null);
        const cardDia = createClickableSummaryCard('📅 Dia Abertura', sortedDiaAbertura, null);
        const cardReservada = createClickableSummaryCard('📆 Data Reservada (Agendamento)', sortedDataReservada, null);
        const cardColaboradorAgend = createClickableSummaryCard('👤 Agendamentos por Colaborador', sortedColaboradorAgend, 'Colaborador');
        const cardPeriodo = createClickableSummaryCard('🕒 Período', sortedPeriodo, 'Melhor horário');

        container.appendChild(cardAssunto);
        container.appendChild(cardGerada);
        container.appendChild(cardDia);
        container.appendChild(cardReservada);
        container.appendChild(cardColaboradorAgend);
        container.appendChild(cardPeriodo);
    }

    function createClickableSummaryCard(title, dataArray, filterCol) {
        const card = document.createElement('div');
        card.className = 'summary-card';
        const h3 = document.createElement('h3');
        h3.textContent = title;
        card.appendChild(h3);

        const table = document.createElement('table');
        if (dataArray.length === 0) {
            const tr = document.createElement('tr');
            const td = document.createElement('td');
            td.textContent = 'Nenhum dado';
            td.colSpan = 2;
            td.style.textAlign = 'center';
            tr.appendChild(td);
            table.appendChild(tr);
        } else {
            dataArray.forEach(([key, count]) => {
                const tr = document.createElement('tr');
                const td1 = document.createElement('td');
                td1.textContent = key;
                const td2 = document.createElement('td');
                td2.textContent = count;
                tr.appendChild(td1);
                tr.appendChild(td2);

                if (filterCol) {
                    tr.classList.add('clickable');
                    tr.addEventListener('click', function(e) {
                        toggleQuickFilter(filterCol, key);
                    });
                }

                table.appendChild(tr);
            });
        }
        card.appendChild(table);
        return card;
    }

    // ---------- Tabela ----------
    function renderTable() {
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('tableBody');
        thead.innerHTML = '';
        tbody.innerHTML = '';

        const colsToShow = displayColumns.filter(c => allColumns.includes(c));

        if (filteredData.length === 0 || colsToShow.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding:20px;">Nenhum dado para exibir.</td></tr>';
            return;
        }

        let headerRow = document.createElement('tr');
        colsToShow.forEach(col => {
            let th = document.createElement('th');
            th.textContent = col;
            headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);

        filteredData.forEach(row => {
            let tr = document.createElement('tr');
            if (row['_temAgendamento']) {
                tr.classList.add('has-schedule');
            }
            colsToShow.forEach(col => {
                let td = document.createElement('td');
                let val = row[col] !== undefined ? row[col] : '';
                td.textContent = val;
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    }

    // ---------- Download ----------
    function updateDownload() {
        const btn = document.getElementById('downloadBtn');
        btn.onclick = function() {
            if (filteredData.length === 0) {
                alert('Não há dados para baixar.');
                return;
            }
            const colsToShow = displayColumns.filter(c => allColumns.includes(c));
            let csvRows = [];
            csvRows.push(colsToShow.join(';'));
            filteredData.forEach(row => {
                let vals = colsToShow.map(col => {
                    let val = row[col] !== undefined ? row[col] : '';
                    if (typeof val === 'string' && (val.includes(';') || val.includes('"'))) {
                        val = '"' + val.replace(/"/g, '""') + '"';
                    }
                    return val;
                });
                csvRows.push(vals.join(';'));
            });
            const csvString = csvRows.join('\n');
            const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'resumo_filtrado.csv';
            link.click();
            URL.revokeObjectURL(link.href);
        };
    }

    // ---------- Evento de upload ----------
    document.getElementById('fileUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        handleFile(file);
    });
</script>
